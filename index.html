<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JeMPRoT NAS Synology</title>
    <style>
        /* CSS Reset & Base Variables */
        :root {
            --bg-color: #0d1117; /* Dark theme / Linux terminal vibe */
            --text-color: #c9d1d9;
            --accent-glow: rgba(255, 255, 255, 0.6);
            --public-color: #2ea043;
            --public-glow: rgba(46, 160, 67, 0.4);
            --private-color: #da3633;
            --private-glow: rgba(218, 54, 51, 0.4);
            --glass-bg: rgba(22, 27, 34, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* Extra padding below for mobile browsers (safe area) */
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Canvas Background */
        #network-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        /* Main Wrapper */
        .wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            z-index: 1;
        }

        /* Header Styling */
        header {
            margin-bottom: 4rem;
            text-align: center;
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo-main {
            height: 55px;
            filter: drop-shadow(0 0 10px var(--accent-glow));
            /* Smooth pulse animation */
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            from { filter: drop-shadow(0 0 8px rgba(255,255,255,0.3)); }
            to { filter: drop-shadow(0 0 18px rgba(255,255,255,0.8)); }
        }

        .cursor {
            font-weight: 800;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Cards Container */
        .cards-container {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        /* Glassmorphism Card Style */
        .card {
            text-decoration: none;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 280px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Card Hover Effects */
        .card:hover {
            transform: translateY(-5px);
        }

        .card.public {
            border-bottom: 3px solid var(--public-color);
        }
        
        .card.public:hover {
            box-shadow: 0 10px 30px var(--public-glow);
            border-color: var(--public-color);
        }

        .card.private {
            border-bottom: 3px solid var(--private-color);
        }

        .card.private:hover {
            box-shadow: 0 10px 30px var(--private-glow);
            border-color: var(--private-color);
        }

        /* SVG Icons inside Cards */
        .icon {
            width: 48px;
            height: 48px;
            margin-bottom: 10px;
        }

        .card.public .icon { stroke: var(--public-color); }
        .card.private .icon { stroke: var(--private-color); }

        .card h2 {
            font-size: 1.5rem;
            color: #ffffff;
            margin: 0;
            font-weight: 600;
        }

        .card p {
            font-size: 0.9rem;
            color: #8b949e;
        }

        /* Footer Styling */
        footer {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(13, 17, 23, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255,255,255,0.05);
            /* Push to bottom safely */
            margin-top: auto; 
            z-index: 1;
        }

        .footer-content {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #8b949e;
            text-align: center;
        }

        .logo-footer {
            height: 26px;
            vertical-align: middle;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        /* Responsive Tweaks */
        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            .logo-main { height: 45px; }
            .cards-container { gap: 1.5rem; }
            .card { padding: 2rem 1.5rem; max-width: 100%; }
            /* Extra padding to prevent footer from being hidden by mobile browser UI */
            footer { padding-bottom: calc(1.5rem + env(safe-area-inset-bottom) + 20px); }
        }
    </style>
</head>
<body>

    <!-- Canvas for Network Nodes Background -->
    <canvas id="network-canvas"></canvas>

    <div class="wrapper">
        <header>
            <h1>
                <img src="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png" alt="JeMPRoT" class="logo-main">
                NAS Synology<span class="cursor">_</span>
            </h1>
        </header>

        <main class="cards-container">
            <!-- Public Card -->
            <a href="https://gofile.me/7CBpz/936XWDHaD" class="card public" target="_blank" rel="noopener noreferrer">
                <!-- Open Folder/Unlock Icon -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
                </svg>
                <h2>Public</h2>
                <p>Akses terbuka untuk umum</p>
            </a>

            <!-- Private Card -->
            <a href="https://gofile.me/7CBpz/yysqYlE18" class="card private" target="_blank" rel="noopener noreferrer">
                <!-- Locked Padlock Icon -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h2>Private</h2>
                <p>Akses terbatas (Password)</p>
            </a>
        </main>
    </div>

    <footer>
        <div class="footer-content">
            Digitally Shaped by 
            <img src="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png" alt="JeMPRoT" class="logo-footer"> 
            Powered by Synology NAS
        </div>
    </footer>

    <!-- Script for Network Nodes Background -->
    <script>
        const canvas = document.getElementById('network-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, particles;

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Adjust particle count dynamically
            const particleCount = width < 600 ? 35 : 75;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.4,
                    vy: (Math.random() - 0.5) * 0.4,
                    radius: Math.random() * 1.5 + 0.5
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            particles.forEach((p, index) => {
                // Move
                p.x += p.vx;
                p.y += p.vy;

                // Bounce off edges smoothly
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                // Draw Particle
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(201, 209, 217, 0.6)';
                ctx.fill();

                // Connect with nearby particles
                for (let j = index + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(201, 209, 217, ${0.15 - dist/866})`;
                        ctx.lineWidth = 0.6;
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.stroke();
                    }
                }
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', () => {
            init();
        });

        init();
        draw();
    </script>
</body>
</html>
